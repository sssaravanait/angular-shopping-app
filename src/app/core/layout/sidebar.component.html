<aside
    class="invisible fixed inset-y-16 left-0 z-40 w-72 -translate-x-full border-r border-slate-200 bg-white px-4 py-6 transition duration-200 md:sticky md:top-16 md:visible md:translate-x-0 md:transform-none"
    id="primary-navigation" [class.visible]="isOpen()" [class.translate-x-0]="isOpen()">
    <nav aria-label="Primary navigation">
        <p class="mb-3 px-3 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Workspace</p>
        <ul class="space-y-1">
            @for (item of navItems; track item.path) {
            <li>
                <a class="group flex min-h-11 items-center gap-3 rounded-md px-3 text-sm text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700"
                    routerLinkActive="bg-emerald-50 font-semibold text-emerald-900" ariaCurrentWhenActive="page"
                    [routerLink]="item.path" [routerLinkActiveOptions]="{ exact: true }" (click)="navigate.emit()">
                    <svg aria-hidden="true" class="size-4.5 shrink-0 text-slate-400 group-hover:text-current"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path [attr.d]="item.icon" />
                    </svg>
                    <span>{{ item.label }}</span>
                </a>
            </li>
            }
        </ul>
    </nav>
</aside>
